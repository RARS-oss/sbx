</g>
<text x="56" y="66" fill="#2bc4b2" font-size="15" font-weight="600" letter-spacing="4">RUST · HERMETIC SANDBOX · TYPED AGENT FEEDBACK</text>
<text x="52" y="150" fill="#eaf3f2" font-size="86" font-weight="800" letter-spacing="-2">sbx</text>
<text x="232" y="150" fill="#9fb4ba" font-size="26" font-weight="600">a hermetic executor for coding agents</text>
<text x="56" y="196" fill="#9fb4ba" font-size="20">Run code in a 4 ms throw-away sandbox and hand the agent a typed <tspan fill="#63e0cf">verdict</tspan> —</text>
<text x="56" y="223" fill="#9fb4ba" font-size="20">parsed crashes, diagnostics, failing tests, and a <tspan fill="#63e0cf">delta</tspan> vs the last run — not 30 KB of stdout.</text>
<rect x="56" y="250" width="470" height="96" rx="8" fill="#16262a" stroke="#24363b"/>
<text x="70" y="270" fill="#7d5b52" font-size="12" font-weight="600" letter-spacing="2" font-family="monospace">RAW STDOUT · ~30 KB</text>
<line x1="70" y1="282" x2="90" y2="282" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="287" x2="143" y2="287" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="293" x2="196" y2="293" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="298" x2="249" y2="298" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="304" x2="302" y2="304" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="309" x2="355" y2="309" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="314" x2="408" y2="314" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="320" x2="461" y2="320" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="325" x2="104" y2="325" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="331" x2="157" y2="331" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<line x1="70" y1="336" x2="210" y2="336" stroke="#7d5b52" stroke-width="2" opacity="0.5"/>
<text x="552" y="306" fill="#2bc4b2" font-size="40" font-weight="700">→</text>
<text x="548" y="330" fill="#9fb4ba" font-size="12" font-family="monospace">4 ms</text>
<rect x="612" y="250" width="532" height="96" rx="8" fill="#16262a" stroke="#2bc4b2" stroke-opacity="0.5"/>
<text x="626" y="272" fill="#2bc4b2" font-size="12.5" font-family="monospace">[sbx] CRASH  exit=1  raw=2820B</text>
<text x="626" y="287" fill="#eaf3f2" font-size="12.5" font-family="monospace">crash: AddressSanitizer heap-buffer-overflow</text>
<text x="626" y="302" fill="#d8a657" font-size="12.5" font-family="monospace">  hint: read/write past the end of a heap allocation</text>
<text x="626" y="317" fill="#9fb4ba" font-size="12.5" font-family="monospace">  at histogram.c:20 in main</text>
<text x="626" y="332" fill="#9fb4ba" font-size="12.5" font-family="monospace">  delta: crash SAME as last run</text>
</svg>