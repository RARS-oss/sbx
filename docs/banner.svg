<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12221f"/><stop offset="1" stop-color="#0d1719"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bc4b2"/><stop offset="1" stop-color="#63e0cf"/></linearGradient></defs><rect x="1" y="1" width="1198" height="370" rx="20" fill="url(#bg)" stroke="#24363b" stroke-width="1.5"/>
<g opacity="0.06" stroke="#2bc4b2" stroke-width="1">
<line x1="0" y1="93" x2="1200" y2="93"/>
<line x1="0" y1="186" x2="1200" y2="186"/>
