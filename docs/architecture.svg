<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12221f"/><stop offset="1" stop-color="#0d1719"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bc4b2"/><stop offset="1" stop-color="#63e0cf"/></linearGradient></defs><rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)" stroke="#24363b" stroke-width="1.5"/>
