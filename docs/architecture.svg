<text x="371" y="122" fill="#2bc4b2" font-size="19" font-weight="700" text-anchor="middle" font-family="monospace">hermit-core</text>
<text x="371" y="148" fill="#9fb4ba" font-size="12.5" text-anchor="middle">clone() into user/pid/mount/net</text>
