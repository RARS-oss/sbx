<text x="943" y="173" fill="#2bc4b2" font-size="24" text-anchor="middle" font-weight="700">→</text>
<rect x="955" y="90" width="205" height="150" rx="10" fill="#16262a" stroke="#63e0cf" stroke-opacity="0.55"/>
<text x="1058" y="122" fill="#63e0cf" font-size="19" font-weight="700" text-anchor="middle" font-family="monospace">Verdict</text>
