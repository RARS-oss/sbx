<text x="600" y="122" fill="#9fb4ba" font-size="19" font-weight="700" text-anchor="middle" font-family="monospace">Outcome</text>
<text x="600" y="148" fill="#9fb4ba" font-size="12.5" text-anchor="middle">exit / signal / timeout</text>
<text x="600" y="165" fill="#9fb4ba" font-size="12.5" text-anchor="middle">rusage · streams · Applied{}</text>
