<text x="1058" y="165" fill="#9fb4ba" font-size="12.5" text-anchor="middle">+ what changed since last run</text>
<text x="40" y="280" fill="#9fb4ba" font-size="14">The executor owns the facts, so it emits <tspan fill="#eaf3f2">facts</tspan>; because it sees consecutive runs, it emits <tspan fill="#eaf3f2">what changed</tspan>. Deterministic parsers, no LLM in the loop.</text>
