name = "c-namebuf"
lang = "c"
family = "memory-safety"
bug = "fixed-size name buffer in a struct overflown by runtime-length names; the required size is not obvious from the source"
prompt = """
`gen.c` fills 50 records with generated names and prints `records=<N> totlen=<L>`. `sh test.sh`
compiles it with AddressSanitizer and checks the output. It currently crashes. Fix the bug in
`gen.c` so the test passes; do not modify `test.sh` or the expected output.
"""
run = "sh test.sh"
files = ["gen.c"]
protected = ["test.sh"]
timeout = 120
