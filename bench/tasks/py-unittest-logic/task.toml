name = "py-unittest-logic"
lang = "python"
family = "logic"
bug = "off-by-one in interval merging (adjacent ranges not merged, boundary dropped)"
prompt = """
`ranges.py` provides `merge(ranges)`: given a list of inclusive integer ranges `(lo, hi)`, return
the minimal sorted list of non-overlapping inclusive ranges covering the same integers; ranges
that touch (e.g. (1,3) and (4,6)) must be merged into (1,6). `sh test.sh` runs the unittest suite
in `test_ranges.py`; some tests currently fail. Fix `ranges.py` so the whole suite passes. Do not
modify the tests.
"""
run = "sh test.sh"
files = ["ranges.py", "test_ranges.py"]
protected = ["test.sh", "test_ranges.py"]
timeout = 60
